<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>許願水族館</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="window.__supabaseLoadError=true"></script><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:linear-gradient(180deg,#e0f2fe,#fdf2f8);min-height:100vh}.glass{background:#ffffffde;backdrop-filter:blur(12px)}.card{box-shadow:0 10px 28px #07598518}</style></head>
<body class="text-slate-700"><main class="max-w-3xl mx-auto p-4 pb-28">
<header class="flex justify-between items-center mb-4"><div><h1 class="text-2xl font-black text-sky-700">🐙 許願水族館 🦈</h1><p id="status" class="text-xs text-slate-500">正在初始化...</p></div><button id="shareBtn" class="hidden px-3 py-2 rounded-xl bg-pink-500 text-white font-bold">分享邀請</button></header>
<section id="gate" class="glass rounded-3xl p-6 card"><h2 class="text-xl font-black text-center mb-2">歡迎來到水族館</h2><p class="text-sm text-center text-slate-500 mb-5">第一次使用請建立水族館；收到邀請連結會自動加入。</p><input id="roomName" maxlength="80" placeholder="水族館名稱" class="w-full p-3 rounded-xl border mb-3"><button id="createBtn" class="w-full p-3 rounded-xl bg-sky-500 text-white font-black">建立新水族館</button><p id="gateMsg" class="text-sm mt-3 text-center text-rose-500"></p></section>
<section id="app" class="hidden space-y-4">
<div class="glass rounded-3xl p-4 card flex gap-2"><input id="cardText" maxlength="3000" placeholder="寫低一個願望..." class="flex-1 p-3 rounded-xl border"><select id="category" class="p-2 rounded-xl border"></select><button id="addBtn" class="px-4 rounded-xl bg-sky-500 text-white font-black">加入</button></div>
<div class="grid grid-cols-2 gap-3"><button id="drawBtn" class="p-5 rounded-3xl bg-gradient-to-r from-pink-400 to-rose-500 text-white font-black text-lg card">🎣 抽一張卡</button><button id="catBtn" class="p-5 rounded-3xl bg-white text-sky-700 font-black card">🏷️ 分類管理</button></div>
<div id="drawResult" class="hidden glass rounded-3xl p-6 card text-center"></div>
<div class="glass rounded-3xl p-4 card"><div class="flex justify-between mb-3"><h2 class="font-black">卡片庫</h2><span id="count" class="text-xs bg-sky-100 px-2 py-1 rounded-full"></span></div><div id="cards" class="space-y-3"></div></div>
</section></main>
<div id="catModal" class="hidden fixed inset-0 bg-slate-900/50 p-4 flex items-center justify-center"><div class="bg-white w-full max-w-md rounded-3xl p-5"><h3 class="font-black text-lg mb-3">分類管理</h3><div class="flex gap-2"><input id="catName" maxlength="50" placeholder="分類名稱" class="flex-1 p-3 border rounded-xl"><input id="catColor" type="color" value="#38bdf8"><button id="addCat">新增</button></div><div id="cats" class="mt-4 space-y-2"></div><button id="closeCat" class="w-full mt-4 p-2 bg-slate-100 rounded-xl">完成</button></div></div>
<script>
const URL='https://hhaipcffwkmguxyracdp.supabase.co';
const KEY='sb_publishable_CYWKmNh8havinKPjoI9JNQ_KXMxxb2P';
let sb=null;
let roomId=null,inviteToken=null,state={cards:[],categories:[]},version=0,channel=null,saving=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,bad=false){$('status').textContent=t;$('status').className='text-xs '+(bad?'text-rose-600':'text-slate-500')}
async function auth(){let {data:{session}}=await sb.auth.getSession();if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}return session.user}
async function load(){const r=await sb.from('aquarium_states').select('data,version').eq('room_id',roomId).single();if(r.error)throw r.error;state=r.data.data||{cards:[],categories:[]};version=r.data.version;localStorage.setItem('aq_room',roomId);localStorage.setItem('aq_cache_'+roomId,JSON.stringify({state,version}));render();}
async function save(){if(!roomId||saving)return;saving=true;const snapshot=JSON.parse(JSON.stringify(state));try{const r=await sb.rpc('save_aquarium_state',{rid:roomId,new_data:snapshot,expected_version:version});if(r.error){if(String(r.error.message).includes('VERSION_CONFLICT')){await load();throw new Error('另一部手機剛更新咗資料，已載入最新版本，請再操作一次。')}throw r.error}version=Number(r.data);localStorage.setItem('aq_cache_'+roomId,JSON.stringify({state,version}));msg('已同步')}catch(e){msg(e.message,true);alert(e.message)}finally{saving=false}}
function render(){state.categories=Array.isArray(state.categories)&&state.categories.length?state.categories:[{id:'general',name:'一般願望',color:'#38bdf8'}];state.cards=Array.isArray(state.cards)?state.cards:[];$('category').innerHTML=state.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('count').textContent=`${state.cards.length} 張`;$('cards').innerHTML=state.cards.length?state.cards.slice().reverse().map(c=>`<article class="p-4 bg-white rounded-2xl border-l-4" style="border-color:${/^#[0-9a-f]{6}$/i.test(c.color)?c.color:'#38bdf8'}"><div class="text-xs text-slate-400">${esc(c.categoryName)} · ${new Date(c.createdAt).toLocaleString('zh-HK')}</div><p class="font-bold my-2 whitespace-pre-wrap">${esc(c.text)}</p><div class="flex gap-2 justify-end"><button onclick="editCard('${c.id}')" class="text-sky-600">修改</button><button onclick="deleteCard('${c.id}')" class="text-rose-500">刪除</button></div></article>`).join(''):'<p class="text-center text-slate-400 py-8">未有卡片</p>';$('cats').innerHTML=state.categories.map(c=>`<div class="flex justify-between p-2 rounded-xl bg-slate-50"><span><i class="inline-block w-3 h-3 rounded-full mr-2" style="background:${c.color}"></i>${esc(c.name)}</span>${c.id==='general'?'':`<button onclick="deleteCat('${c.id}')" class="text-rose-500">刪除</button>`}</div>`).join('')}
async function enter(){ $('gate').classList.add('hidden');$('app').classList.remove('hidden');$('shareBtn').classList.remove('hidden');await load();if(channel)await sb.removeChannel(channel);channel=sb.channel('room-'+roomId).on('postgres_changes',{event:'UPDATE',schema:'public',table:'aquarium_states',filter:`room_id=eq.${roomId}`},p=>{if(Number(p.new.version)>version){state=p.new.data;version=Number(p.new.version);localStorage.setItem('aq_cache_'+roomId,JSON.stringify({state,version}));render();msg('收到另一部裝置嘅更新')}}).subscribe();msg('已連接水族館')}
$('createBtn').onclick=async()=>{try{$('createBtn').disabled=true;await auth();const r=await sb.rpc('create_aquarium',{room_name:$('roomName').value||'許願水族館'});if(r.error)throw r.error;roomId=r.data[0].room_id;inviteToken=r.data[0].invite_token;history.replaceState({},'',location.pathname);await enter()}catch(e){$('gateMsg').textContent='建立失敗：'+e.message}finally{$('createBtn').disabled=false}};
$('addBtn').onclick=async()=>{const text=$('cardText').value.trim();if(!text)return;const cat=state.categories.find(c=>c.id===$('category').value)||state.categories[0];state.cards.push({id:crypto.randomUUID(),text,categoryId:cat.id,categoryName:cat.name,color:cat.color,createdAt:new Date().toISOString()});$('cardText').value='';render();await save()};
window.editCard=async id=>{const c=state.cards.find(x=>x.id===id);if(!c)return;const text=prompt('修改卡片',c.text);if(text===null||!text.trim())return;c.text=text.trim();render();await save()};window.deleteCard=async id=>{if(!confirm('確定刪除？'))return;state.cards=state.cards.filter(c=>c.id!==id);render();await save()};
$('drawBtn').onclick=()=>{if(!state.cards.length)return alert('暫時冇卡可以抽');const c=state.cards[Math.floor(Math.random()*state.cards.length)];$('drawResult').innerHTML=`<div class="text-sm text-sky-600">抽中：${esc(c.categoryName)}</div><div class="text-xl font-black mt-2 whitespace-pre-wrap">${esc(c.text)}</div>`;$('drawResult').classList.remove('hidden')};
$('catBtn').onclick=()=>$('catModal').classList.remove('hidden');$('closeCat').onclick=()=>$('catModal').classList.add('hidden');$('addCat').onclick=async()=>{const name=$('catName').value.trim();if(!name)return;state.categories.push({id:crypto.randomUUID(),name,color:$('catColor').value});$('catName').value='';render();await save()};window.deleteCat=async id=>{if(state.cards.some(c=>c.categoryId===id))return alert('呢個分類仲有卡片，請先修改或刪除卡片。');state.categories=state.categories.filter(c=>c.id!==id);render();await save()};
$('shareBtn').onclick=async()=>{if(!inviteToken){const r=await sb.from('aquarium_rooms').select('invite_token').eq('id',roomId).single();if(r.error)return alert(r.error.message);inviteToken=r.data.invite_token}const link=`${location.origin}${location.pathname}?invite=${inviteToken}`;await navigator.clipboard.writeText(link);alert('邀請連結已複製')};
(async()=>{try{
if(window.__supabaseLoadError || !window.supabase){throw new Error('Supabase 程式庫載入失敗。請關閉內容阻擋器，並確認網絡可連接 cdn.jsdelivr.net。');}
sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
msg('正在連接 Supabase...');
await auth();const token=new URLSearchParams(location.search).get('invite');if(token){msg('正在加入邀請房間...');const r=await sb.rpc('join_aquarium',{token});if(r.error)throw r.error;roomId=r.data;history.replaceState({},'',location.pathname);await enter();return}const saved=localStorage.getItem('aq_room');if(saved){roomId=saved;try{await enter();return}catch(e){localStorage.removeItem('aq_room')}}msg('請建立新水族館')}catch(e){msg('初始化失敗：'+e.message,true);$('gateMsg').textContent='錯誤：'+e.message+'。請確認已開啟 Anonymous Sign-ins、已完整執行 SQL，亦沒有 Safari 內容阻擋器。'}})();
</script></body></html>
